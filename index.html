<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Birdsongs · lofi melodies on the wire</title>
    <meta name="description" content="A lofi pixel-art radio. Birds land on and leave the power lines, and every landing and every take-off plays one note of a song you know. Rain, snow and thunder included." />
    <link rel="canonical" href="https://birdsongs.superfun.games/" />
    <meta name="application-name" content="Birdsongs" />
    <meta name="author" content="Superfun" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- the theme colour follows the sky while it plays (src/ui/live-icon.js) -->
    <meta name="theme-color" content="#1a1636" />
    <meta name="color-scheme" content="dark" />

    <!-- icons + install -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Birdsongs" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <!-- sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Birdsongs" />
    <meta property="og:title" content="Birdsongs · lofi melodies on the wire" />
    <meta property="og:description" content="Every bird on the wire is a note. A lofi pixel-art radio of songs you know, played by birds landing and taking off, with rain." />
    <meta property="og:url" content="https://birdsongs.superfun.games/" />
    <meta property="og:image" content="https://birdsongs.superfun.games/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pixel-art birds perched on sagging power lines against a dusk sky, under the title “birdsongs, lo-fi radio”." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Birdsongs · lofi melodies on the wire" />
    <meta name="twitter:description" content="Every bird on the wire is a note. A lofi pixel-art radio, with rain." />
    <meta name="twitter:image" content="https://birdsongs.superfun.games/og.png" />
    <meta name="twitter:image:alt" content="Pixel-art birds perched on sagging power lines against a dusk sky, under the title “birdsongs, lo-fi radio”." />

    <!-- fonts: connect early, swap in when ready -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&family=Silkscreen&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&family=Silkscreen&display=swap" rel="stylesheet" />
    <!-- JSON-LD (app + playlist) is generated from the song list at build time: see vite.config.js -->
  </head>
  <body>
    <canvas id="stage" aria-label="Pixel-art birds landing on and leaving power lines; each one plays a note"></canvas>
    <noscript><p class="noscript">Birdsongs is a little radio drawn and played live in your browser, so it needs JavaScript (and WebGL) switched on.</p></noscript>

    <div id="intro" class="intro">
      <div class="intro-card">
        <div class="kicker">a lofi radio for the wires</div>
        <h1 class="title">birdsongs</h1>
        <p class="tagline">every landing is a note. every take-off, another.</p>
        <button id="start" class="start" type="button"><span class="ico"></span><span class="blink">tap to listen</span></button>
        <p class="hint">headphones on · rain included</p>
      </div>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
    <div id="flash" class="flash" aria-live="polite"></div>

    <div id="dock" class="dock">
      <div id="panel" class="panel" hidden>
        <div class="panel-head">
          <div class="kicker">now playing</div>
          <button id="hide-ui" class="icon-btn" type="button" title="Close (H)" aria-label="Close settings"></button>
        </div>
        <div id="song-title" class="song-title">…</div>
        <div id="song-meta" class="song-meta"></div>

        <div class="toggles">
          <button id="t-music" class="toggle" type="button" aria-pressed="true" title="Music (M)"><span class="ico"></span><span class="lbl">music</span><span class="box"></span></button>
          <button id="t-sound" class="toggle" type="button" aria-pressed="true" title="Weather & wings (S)"><span class="ico"></span><span class="lbl">sounds</span><span class="box"></span></button>
          <button id="t-notes" class="toggle" type="button" aria-pressed="true" title="Show a little note when a bird plays (T)"><span class="ico"></span><span class="lbl">notes</span><span class="box"></span></button>
          <button id="t-silhouette" class="toggle" type="button" aria-pressed="false" title="Silhouette mode (O)"><span class="ico"></span><span class="lbl">silhouette</span><span class="box"></span></button>
          <button id="t-shuffle" class="toggle" type="button" aria-pressed="false" title="Shuffle the wires every song (W)"><span class="ico"></span><span class="lbl">shuffle</span><span class="box"></span></button>
          <button id="t-full" class="toggle" type="button" aria-pressed="false" title="Fullscreen (F)"><span class="ico"></span><span class="lbl">full</span><span class="box"></span></button>
        </div>

        <label class="vol">
          <span class="lbl">vol</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume" />
        </label>

        <div class="picker">
          <button id="scene-prev" class="icon-btn" type="button" title="Previous scene (←)" aria-label="Previous scene"></button>
          <div class="picker-name"><span class="kicker">scene</span><span id="scene-name"></span></div>
          <button id="scene-next" class="icon-btn" type="button" title="Next scene (→)" aria-label="Next scene"></button>
        </div>
        <div class="picker">
          <button id="bird-prev" class="icon-btn" type="button" title="Previous bird (shift+B)" aria-label="Previous kind of bird"></button>
          <div class="picker-name"><span class="kicker">birds</span><span id="bird-name"></span></div>
          <button id="bird-next" class="icon-btn" type="button" title="Next bird (B)" aria-label="Next kind of bird"></button>
        </div>

        <div class="actions">
          <button id="skip" class="text-btn" type="button" title="Next song (N)"><span>next song</span></button>
          <button id="reshuffle" class="text-btn" type="button" title="New wires (R)" hidden><span>new wires</span></button>
          <button id="share" class="text-btn" type="button" title="Share this scene"><span>share</span></button>
          <button id="install" class="text-btn" type="button" title="Install Birdsongs as an app" hidden><span>install</span></button>
        </div>
        <div class="keys">M music · S sounds · T notes<br />O silhouette · B birds<br />W shuffle · R new wires<br />←→ scene · N song · H panel · F full</div>
      </div>

      <div class="bar">
        <span class="viewers" title="People listening right now"><span class="dot"></span><span id="viewers">1</span><span class="lbl">listening</span></span>
        <span id="cast-wrap" class="cast-wrap" title="Play on your TV" hidden><google-cast-launcher></google-cast-launcher></span>
        <button id="dock-toggle" class="dock-toggle" type="button" aria-expanded="false" aria-controls="panel" title="Settings" aria-label="Settings"></button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
